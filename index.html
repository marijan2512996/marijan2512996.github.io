<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marijan Ikanović</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .container {
    text-align: center;
    max-width: 800px;
    animation: fadeIn 1s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    margin-bottom: 10px;
    background: linear-gradient(90deg, #fff, #a8b5ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -1px;
  }

  .subtitle {
    font-size: clamp(1rem, 2vw, 1.25rem);
    color: #a8b5ff;
    margin-bottom: 50px;
    opacity: 0.9;
  }

  .project-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 40px 30px;
    margin: 0 auto;
    max-width: 500px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .project-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
  }

  .project-icon {
    font-size: 3rem;
    margin-bottom: 15px;
  }

  .project-card h2 {
    font-size: 1.8rem;
    margin-bottom: 10px;
  }

  .project-card p {
    color: #c5cae9;
    line-height: 1.6;
    margin-bottom: 25px;
  }

  .btn {
    display: inline-block;
    padding: 12px 30px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    color: #fff;
    text-decoration: none;
    border-radius: 50px;
    font-weight: 600;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .btn:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
  }

  footer {
    margin-top: 60px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.9rem;
  }

  .dots {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: -1;
  }

  .dot {
    position: absolute;
    width: 4px;
    height: 4px;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    animation: float 6s infinite ease-in-out;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); opacity: 0.3; }
    50% { transform: translateY(-30px); opacity: 0.8; }
  }
</style>
</head>
<body>

<div class="dots">
  <div class="dot" style="top: 10%; left: 15%; animation-delay: 0s;"></div>
  <div class="dot" style="top: 20%; left: 80%; animation-delay: 1s;"></div>
  <div class="dot" style="top: 60%; left: 10%; animation-delay: 2s;"></div>
  <div class="dot" style="top: 70%; left: 90%; animation-delay: 3s;"></div>
  <div class="dot" style="top: 40%; left: 50%; animation-delay: 4s;"></div>
  <div class="dot" style="top: 85%; left: 40%; animation-delay: 1.5s;"></div>
</div>

<div class="container">
  <h1>Marijan Ikanović</h1>
  <p class="subtitle">Welcome to my page</p>

  <div class="project-card">
    <div class="project-icon">⏱️</div>
    <h2>TimeSense</h2>
    <p>An Android game that tests your sense of time. How accurately can you estimate seconds without a clock?</p>
    <a href="https://play.google.com/store/apps/details?id=com.timesense.game" class="btn" target="_blank" rel="noopener">Get it on Google Play</a>
  </div>

  <footer>
    © 2026 Marijan Ikanović
  </footer>
</div>

</body>
</html>
